[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "so100"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "matplotlib",
    "numpy",
    "pyserial",
    "feetech-servo-sdk",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["drivers*"]
